<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Offline · Mr. Chartist Invoice</title>
<style>
  :root{color-scheme:light dark;--bg:#f4f5f0;--fg:#1f0d14;--brand:#ee6125;--mut:#6b6258}
  @media (prefers-color-scheme:dark){:root{--bg:#06080a;--fg:#f4f5f0;--mut:#a39a8e}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center}
  h1{font-size:1.4rem;margin:0 0 .5rem}p{color:var(--mut);max-width:34ch;margin:0 auto 1.25rem;line-height:1.5}
  button{background:var(--brand);color:#1f0d14;border:0;border-radius:10px;padding:.75rem 1.25rem;font-weight:700;font-size:1rem;min-height:44px;cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>This page has not been saved for offline use yet. Your invoices are safe on this device. Reconnect once and reload.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
